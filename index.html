<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明日方舟 · 横板战线</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#141821; --panel2:#1b2130; --edge:#2a3347;
    --ink:#e8ecf4; --ink2:#9aa6bd; --accent:#ffb300;
    --good:#5ad06a; --bad:#ff5d5d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    user-select:none; -webkit-user-select:none;}
  #wrap{max-width:940px;margin:0 auto;padding:10px 12px 30px;}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .brand{font-weight:800;font-size:15px;letter-spacing:.5px;
    background:linear-gradient(90deg,#ffb300,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  .stat{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
    padding:6px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .stat .lbl{color:var(--ink2);font-weight:500;font-size:11px;}
  .stat b{font-variant-numeric:tabular-nums;}
  .dp{color:var(--accent);} .lives{color:var(--bad);} .ene{color:#7fd0ff;} .wv{color:#c9a7ff;} .sc{color:#5ad06a;}
  .btn{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:10px;
    padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;min-width:42px;text-align:center;}
  .btn:hover{background:#232b3d;} .btn:active{transform:translateY(1px);}
  #stage{position:relative;background:#0a0c11;border:1px solid var(--edge);border-radius:14px;padding:8px;margin-bottom:10px;}
  canvas#game{width:100%;max-width:920px;height:auto;display:block;border-radius:8px;cursor:crosshair;image-rendering:pixelated;}
  .card .ico canvas{width:38px;height:38px;display:block;}
  .hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:#cfd8ea;background:rgba(10,12,17,.72);
    padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);pointer-events:none;max-width:75%;}
  #sel{position:absolute;top:14px;right:14px;background:rgba(13,15,20,.92);border:1px solid var(--edge);
    border-radius:12px;padding:10px 12px;font-size:12px;min-width:160px;display:none;z-index:5;}
  #sel.show{display:block;}
  #sel .nm{font-weight:800;font-size:14px;} #sel .rl{color:var(--ink2);font-size:11px;margin-bottom:8px;}
  #sel .btn{font-size:12px;padding:6px 10px;width:100%;margin-top:6px;}
  #panel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  @media(min-width:520px){#panel{grid-template-columns:repeat(6,1fr);}}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 6px 7px;
    text-align:center;cursor:pointer;position:relative;transition:transform .06s,border-color .12s;}
  .card:hover{transform:translateY(-2px);border-color:#4a5a80;}
  .card:active{transform:translateY(0);}
  .card .ico{width:38px;height:38px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;
    border-radius:9px;background:#10141d;}
  .card .nm{font-size:12px;font-weight:700;} .card .rl{font-size:10px;color:var(--ink2);}
  .card .cost{display:inline-block;background:#2a2200;color:var(--accent);border:1px solid #5a4a00;border-radius:8px;
    font-size:11px;font-weight:800;padding:1px 7px;margin-top:4px;}
  .card.off{opacity:.42;pointer-events:none;}
  .card.placing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .card .cd{position:absolute;inset:0;border-radius:12px;background:rgba(0,0,0,.66);display:none;align-items:center;
    justify-content:center;font-size:15px;font-weight:800;color:#fff;}
  .card .cd.show{display:flex;}
  #overlay{position:fixed;inset:0;background:rgba(6,8,12,.82);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;backdrop-filter:blur(3px);}
  #overlay.hidden{display:none;}
  .box{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:24px 26px;max-width:580px;
    width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .box h1{margin:0 0 4px;font-size:24px;letter-spacing:1px;}
  .box .sub{color:var(--ink2);font-size:13px;margin-bottom:14px;line-height:1.6;}
  .box h2{margin:16px 0 8px;font-size:15px;color:#cfd8ea;}
  .big-btn{display:block;width:100%;background:linear-gradient(180deg,#ffb300,#ff8a00);border:none;color:#1a1200;
    font-size:17px;font-weight:800;border-radius:12px;padding:13px;cursor:pointer;margin-top:8px;letter-spacing:2px;}
  .big-btn:hover{filter:brightness(1.06);}
  .ops-guide{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;color:var(--ink2);}
  .ops-guide b{color:var(--ink);}
  .kbd{display:inline-block;background:#000;border:1px solid var(--edge);border-radius:5px;padding:0 6px;font-size:11px;}
  .viz-root{color-scheme:dark;--surface-1:#1a1a19;--text-primary:#ffffff;--text-secondary:#c3c2b7;
    --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--series-5:#d55181;--series-6:#008300;}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px;}
  .tile{background:#12141b;border:1px solid var(--edge);border-radius:10px;padding:10px;text-align:center;}
  .tile .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
  .tile .l{font-size:11px;color:var(--ink2);margin-top:2px;}
  .chart{margin-top:12px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;}
  .bar-row .tag{width:90px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary);}
  .bar-row .track{flex:1;height:16px;background:#0e0f12;border-radius:5px;overflow:hidden;}
  .bar-row .fill{height:100%;border-radius:5px 0 0 5px;}
  .bar-row .val{width:78px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:600;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 2px;font-size:11px;color:var(--text-secondary);}
  .legend .lg{display:inline-flex;align-items:center;gap:5px;}
  .legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  table.mini{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;color:var(--text-secondary);}
  table.mini th,table.mini td{text-align:left;padding:4px 6px;border-bottom:1px solid #232530;}
  table.mini th{color:var(--text-primary);font-weight:600;}
  table.mini td.r,table.mini th.r{text-align:right;font-variant-numeric:tabular-nums;}
  .foot{margin-top:16px;font-size:11px;color:#5d6675;text-align:center;line-height:1.7;}
</style>
</head>

    <div class="stats">

    <div id="sel"></div>
  </div>

</div>

<div id="overlay" class="hidden">

</div>

// drawSprite: rows = 字符串数组, pal = {字符:色}, '.'/' ' 透明
function drawSprite(spr,x,y,flip){
  const s=spr.s||3;
  for(let r=0;r<spr.rows.length;r++){
    const row=spr.rows[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c]; if(ch==='.'||ch===' ')continue;
      const col=spr.pal[ch]; if(!col)continue;
      ctx.fillStyle=col;
      const px=flip?(x+(row.length-1-c)*s):(x+c*s);
      ctx.fillRect(px,y+r*s,s,s);
    }
  }
}

const OP_W=64, OP_H=80; // 立绘显示框(脚底为基准):宽≤64 高≤80
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; const t=amt<0?0:255,p=Math.abs(amt); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b); return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }

/* ============================== 音效 ============================== */
let AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
function tone(f,d,type,vol,slide){
  if(!AC)return; const t=AC.currentTime; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol||.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
}
const sfx={deploy:()=>{tone(300,.12,'square',.07,600);},retreat:()=>{tone(500,.2,'sine',.08,250);},
  hit:()=>{tone(200,.05,'sawtooth',.05);},kill:()=>{tone(150,.18,'sawtooth',.07,60);},
  shot:()=>{tone(900,.06,'square',.03,400);},leak:()=>{tone(120,.3,'sawtooth',.09,60);},
  splash:()=>{tone(180,.2,'sawtooth',.08,90);},lose:()=>{[300,240,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.08),i*180));}};

/* ============================== 状态 ============================== */
const state={
  dp:START_DP, lives:3, time:0, speed:1, paused:false, over:null, score:0,
  operators:[], enemies:[], projectiles:[], particles:[], floaters:[],
  wave:0, waveActive:false, waveTime:0, spawns:[], intermission:2.5, started:false,
  placingKey:null, selected:null, mouse:{x:-1,y:-1},
  stats:{damage:{},kills:{},waves:0,killsTotal:0},
  redeploy:{},
  groundScroll:0, cloudScroll:0,
};
const deployedKeys=new Set();

/* ============================== 工具 ============================== */
const $=id=>document.getElementById(id);
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function slotOf(s){return s.x+','+s.y;}
function occupiedSlot(s){return state.operators.find(o=>o.alive&&o.slot===slotOf(s));}
function canPlace(key,slot){
  if(state.over)return false;
  const def=OPS[key];
  if(def.cls==='melee' && slot.y===PLATFORM_Y)return false;
  if(def.cls==='ranged' && slot.y===GROUND_Y)return false;
  if(occupiedSlot(slot))return false;
  if(deployedKeys.has(key))return false;
  if(state.redeploy[key]>0)return false;
  if(state.dp<def.cost)return false;
  return true;
}
function place(key,slot){
  const def=OPS[key];
  state.dp-=def.cost;
  state.operators.push({key,def,slot:slotOf(slot),x:slot.x,y:slot.y,atkCd:def.interval*.5,hp:def.hp,maxHp:def.hp,dpCd:def.dpGen||0,healCd:0,alive:true,flashT:0,phase:Math.random()*6.28});
  deployedKeys.add(key); sfx.deploy();
}
function retreat(op){
  op.alive=false; deployedKeys.delete(op.key);
  state.dp=Math.min(99,state.dp+Math.floor(op.def.cost/2));
  state.redeploy[op.key]=12;
  burst(op.x,op.y,op.def.color,12); sfx.retreat();
  if(state.selected===op)state.selected=null;
}
function float(x,y,text,color,size){state.floaters.push({x,y,text,color,size:size||13,life:.9,vy:-34});}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*140;
  state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.45+Math.random()*.4,color,r:2+Math.random()*3});}}
function addDmg(k,v){state.stats.damage[k]=(state.stats.damage[k]||0)+v;}
function opDamage(op,en){ if(op.def.magic)return op.def.atk; return Math.max(1,op.def.atk-en.def.def); }

/* ============================== 波次 ============================== */
function genWave(n){
  const g=[];
  g.push({e:'slug',n:6+n*2,gap:Math.max(.7,1.7-n*.05),d:1});
  if(n>=2)g.push({e:'hound',n:4+n,gap:.9,d:4});
  if(n>=3)g.push({e:'heavy',n:1+Math.floor(n/3),gap:3.5,d:6});
  if(n>=4)g.push({e:'drone',n:3+Math.floor(n/2),gap:1.3,d:8});
  if(n>=5)g.push({e:'frenzied',n:2+Math.floor(n/2),gap:2.0,d:10});
  if(n>=6)g.push({e:'boss',n:1+Math.floor((n-6)/5),gap:1,d:12});
  return g;
}
function startWave(n){
  state.wave=n; state.waveActive=true; state.waveTime=0; state.spawns=[];
  for(const g of genWave(n))for(let k=0;k<g.n;k++)state.spawns.push({t:g.d+k*g.gap,type:g.e});
  state.spawns.sort((a,b)=>a.t-b.t);
  state.stats.waves=Math.max(state.stats.waves,n);
}
function spawnEnemy(type){
  const def=ENEMIES[type];
  const y=def.fly? PLATFORM_Y-10 : GROUND_Y;
  state.enemies.push({type,def,hp:def.hp,maxHp:def.hp,x:W+24,y,blockedBy:null,slowT:0,atkCd:0,alive:true,phase:Math.random()*6.28});
}
function leak(e){
  e.alive=false; state.lives=Math.max(0,state.lives-e.def.leak); sfx.leak(); flash();
  if(state.lives<=0){state.over='lose'; sfx.lose(); showResult();}
}
let flashT=0; function flash(){flashT=.5;}

/* ============================== 目标选择 ============================== */
function inRange(op,e){
  return Math.abs(e.x-op.x)<=op.def.range;
}
function pickTarget(op){
  let list=state.enemies.filter(e=>e.alive&&inRange(op,e));
  if(op.def.cls==='melee'){
    list=list.filter(e=>!e.def.fly);
    const b=list.find(e=>e.blockedBy===op);
    if(b)return b;
    if(list.length===0)return null;
    return list.reduce((a,b)=>a.x<b.x?a:b);
  }
  if(list.length===0)return null;
  if(op.def.antiAir){const fly=list.filter(e=>e.def.fly); if(fly.length)list=fly;}
  if(op.def.lowDef){return list.reduce((a,b)=>a.def.def<b.def.def?a:b);}
  return list.reduce((a,b)=>a.x<b.x?a:b); // 离基地最近
}

/* ============================== 更新 ============================== */
function update(dt){
  state.time+=dt;
  state.groundScroll=(state.groundScroll+dt*55)%24;
  state.cloudScroll=(state.cloudScroll+dt*14)%920;
  if(flashT>0)flashT-=dt;

  // 费用
  state.dp=Math.min(99,state.dp+DP_PER_SEC*dt);
  for(const op of state.operators){ if(!op.alive)continue;
    if(op.def.dpGen){op.dpCd-=dt; if(op.dpCd<=0){op.dpCd=op.def.dpGen; state.dp=Math.min(99,state.dp+1);} }
  }
  for(const k in state.redeploy){ if(state.redeploy[k]>0){state.redeploy[k]-=dt; if(state.redeploy[k]<=0)delete state.redeploy[k];} }

  // 波次推进
  if(!state.waveActive && state.over===null){
    state.intermission-=dt;
    if(state.intermission<=0)startWave(state.wave+1);
  }
  if(state.waveActive){
    state.waveTime+=dt;
    while(state.spawns.length && state.spawns[0].t<=state.waveTime)spawnEnemy(state.spawns.shift().type);
    if(state.spawns.length===0 && !state.enemies.some(e=>e.alive)){
      state.waveActive=false; state.intermission=INTERMISSION;
      state.score+=state.wave*50;
    }
  }

  // 敌人移动 / 阻挡
  for(const e of state.enemies){ if(!e.alive)continue;
    const sp=e.def.speed;
    if(!e.def.fly && !e.blockedBy){
      const b=findBlocker(e); if(b)e.blockedBy=b;
    }
    if(e.blockedBy){ if(!e.blockedBy.alive)e.blockedBy=null; else continue; }
    e.x-=sp*dt;
    if(e.x<BASE_X)leak(e);
  }

  // 干员攻击 / 治疗 / 掉血
  for(const op of state.operators){ if(!op.alive)continue;
    op.atkCd-=dt; if(op.flashT>0)op.flashT-=dt;
    if(op.def.heal){ op.healCd-=dt; if(op.healCd<=0){ op.healCd=op.def.heal.cd; healAlly(op); } }
    if(op.def.drain){ op.hp=Math.max(1, op.hp - op.maxHp*0.01*dt); }
    if(op.atkCd<=0){
      const t=pickTarget(op);
      if(t){ op.atkCd=op.def.interval; op.flashT=.12;
        if(op.def.cls==='ranged'){ state.projectiles.push({x:op.x+26,y:op.y-16,target:t,speed:560,
          dmg:opDamage(op,t),magic:!!op.def.magic,splash:op.def.splash||0,color:op.def.color,key:op.key}); sfx.shot(); }
        else applyHit(op,t);
      }
    }
  }

  // 敌人攻击阻挡者
  for(const e of state.enemies){ if(!e.alive)continue;
    const b=e.blockedBy; if(!b||!b.alive)continue;
    e.atkCd-=dt; if(e.atkCd<=0){ e.atkCd=e.def.intv;
      const dmg=Math.max(1, e.def.atk-b.def.def);
      b.hp-=dmg; float(b.x,b.y-34,'-'+dmg,'#ff5d5d',12);
      if(b.hp<=0)opDeath(b);
    }
  }

  // 投射物
  for(const p of state.projectiles){ const e=p.target;
    if(!e.alive){p.dead=true;continue;}
    const dx=e.x-p.x, dy=e.y-p.y, d=Math.hypot(dx,dy), step=p.speed*dt;
    if(d<=step+8){ p.dead=true;
      if(p.splash){ const half=Math.max(1,Math.floor(p.dmg/2));
        for(const en of state.enemies){ if(en.alive && Math.abs(en.x-e.x)<=p.splash && en.def.fly===e.def.fly){ applyHit({dmg:p.dmg,magic:p.magic,color:p.color,key:p.key},en); applyHit({dmg:half,magic:p.magic,color:p.color,key:p.key},en);} } sfx.splash(); burst(e.x,e.y,'#ff8f00',16);}
      else applyHit(p,e);
    } else { p.x+=dx/d*step; p.y+=dy/d*step; }
  }
  state.projectiles=state.projectiles.filter(p=>!p.dead);

  // 粒子/飘字
  for(const p of state.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;}
  state.particles=state.particles.filter(p=>p.life>0);
  for(const f of state.floaters){f.life-=dt;f.y+=f.vy*dt;}
  state.floaters=state.floaters.filter(f=>f.life>0);

  state.enemies=state.enemies.filter(e=>e.alive);
  state.operators=state.operators.filter(o=>o.alive);
}
function applyHit(src,en){
  if(!en.alive)return;
  const dmg=src.dmg!==undefined?src.dmg:opDamage(src,en);
  en.hp-=dmg;
  const magic=src.magic||(src.def&&src.def.magic);
  float(en.x,en.y-30,'-'+dmg, magic?'#c9a7ff':'#ffe08a', 13);
  burst(en.x,en.y, src.color||'#ffd54f', 5);
  if(src.key)addDmg(src.key,dmg);
  if(en.hp<=0)killEnemy(en, src.key?findOp(src.key):null);
  sfx.hit();
}
function findOp(key){return state.operators.find(o=>o.alive&&o.key===key);}
function healAlly(op){
  let best=null;
  for(const o of state.operators){ if(!o.alive)continue;
    if(Math.abs(o.x-op.x)>op.def.heal.range)continue;
    if(o.hp>=o.maxHp)continue;
    if(!best||o.hp<best.hp)best=o;
  }
  if(best){ best.hp=Math.min(best.maxHp,best.hp+op.def.heal.amt); float(best.x,best.y-30,'+'+op.def.heal.amt,'#5ad06a',12); }
}
function opDeath(op){
  op.alive=false; deployedKeys.delete(op.key); state.redeploy[op.key]=12;
  burst(op.x,op.y,op.def.color,16); sfx.retreat();
  if(state.selected===op){state.selected=null;renderSelected();}
}
function killEnemy(e,byOp){
  e.alive=false;
  if(byOp){state.stats.kills[byOp.key]=(state.stats.kills[byOp.key]||0)+1;}
  state.stats.killsTotal++; state.score+=10;
  state.dp=Math.min(99,state.dp+e.def.dp);
  burst(e.x,e.y,EBURST[e.def.key]||'#fff', e.def.key==='boss'?40:14); sfx.kill();
}
function findBlocker(e){
  let best=null,bestX=1e9;
  for(const op of state.operators){ if(!op.alive||op.def.cls!=='melee')continue;
    const n=state.enemies.filter(x=>x.alive&&x.blockedBy===op).length;
    if(n>=op.def.block)continue;
    if(e.x<=op.x+18 && e.x>op.x-40){ if(op.x<bestX){bestX=op.x;best=op;} }
  }
  return best;
}

/* ============================== 渲染 ============================== */
const cv=$('game'), ctx=cv.getContext('2d');
function setupCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}
function drawBg(){
  // 天空
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#10131f'); sky.addColorStop(.6,'#181c2b'); sky.addColorStop(1,'#1e2434');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // 远景剪影
  ctx.fillStyle='rgba(70,84,110,.5)';
  for(let x=-W;x<W;x+=120){ const bx=x+state.cloudScroll; const h=40+((x*7)%90); ctx.fillRect(bx,H-GROUND_Y-h+6,60,h); }
  // 云
  ctx.fillStyle='rgba(150,170,200,.14)';
  for(let x=-W;x<W;x+=220){ const cx=x+state.cloudScroll*.6; ctx.fillRect(cx,40+((x*13)%60),70,14); ctx.fillRect(cx+14,32+((x*13)%60),42,12); }
  // 高台
  ctx.fillStyle='#2b3342'; ctx.fillRect(80,PLATFORM_Y+10,360,14);
  ctx.fillStyle='#39445a'; ctx.fillRect(80,PLATFORM_Y+10,360,5);
  // 地面
  ctx.fillStyle='#232a35'; ctx.fillRect(0,GROUND_Y,H-GROUND_Y+40,W);
  ctx.fillStyle='#2e3646'; ctx.fillRect(0,GROUND_Y,W,6);
  // 地面滚动纹理
  ctx.fillStyle='rgba(255,255,255,.05)';
  for(let x=-24+state.groundScroll;x<W;x+=48){ ctx.fillRect(x,GROUND_Y+26,3,8); }
  // 基地
  ctx.fillStyle='#ffb300'; ctx.fillRect(BASE_X-6,GROUND_Y-64,10,64);
  ctx.fillStyle='#ffd54f'; ctx.fillRect(BASE_X-4,GROUND_Y-64,6,64);
  ctx.fillStyle='rgba(255,93,93,.25)'; ctx.fillRect(BASE_X-24,GROUND_Y-70,44,6);
}
function drawSlot(s,cls){
  const isGround=s.y===GROUND_Y;
  const ok=state.placingKey && OPS[state.placingKey].cls===cls;
  ctx.fillStyle=isGround?'rgba(120,90,50,.20)':'rgba(70,100,140,.22)';
  ctx.fillRect(s.x-34,s.y-78,68,80);
  ctx.strokeStyle=ok?'#5ad06a':(isGround?'rgba(216,178,120,.40)':'rgba(150,180,215,.40)');
  ctx.lineWidth=ok?2:1; ctx.strokeRect(s.x-34,s.y-78,68,80);
  ctx.fillStyle=ok?'#c8ffcf':(isGround?'#d8b68a':'#a8c4e0');
  ctx.font='bold 11px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText(isGround?'地面':'高台', s.x, s.y-58);
}
function drawEye(g,x,y,iris){
  g.fillStyle='#fff'; g.beginPath(); g.ellipse(x,y,4.6,6,0,0,6.28); g.fill();
  const grd=g.createRadialGradient(x,y+1,.4,x,y+1,3.8);
  grd.addColorStop(0,shade(iris,-.2)); grd.addColorStop(1,iris);
  g.fillStyle=grd; g.beginPath(); g.ellipse(x,y+1,3.3,4.7,0,0,6.28); g.fill();
  g.fillStyle='#1b1414'; g.beginPath(); g.ellipse(x,y+1,1.5,2.5,0,0,6.28); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(x-1.4,y-1.6,1.3,0,6.28); g.fill();
  g.beginPath(); g.arc(x+1.4,y+2.1,.7,0,6.28); g.fill();
  g.strokeStyle='#4a3a34'; g.lineWidth=1.3; g.lineCap='round';
  g.beginPath(); g.arc(x,y,4.6,Math.PI*1.02,Math.PI*1.98); g.stroke();
}
function drawChibi(g,c){
  const hy=-46, R=17;
  // 光翼(天使)
  if(c.wing){
    g.fillStyle='rgba(255,255,255,.92)';
    g.beginPath(); g.moveTo(-15,-34); g.quadraticCurveTo(-27,-42,-22,-50); g.quadraticCurveTo(-16,-44,-13,-36); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(15,-34); g.quadraticCurveTo(27,-42,22,-50); g.quadraticCurveTo(16,-44,13,-36); g.closePath(); g.fill();
  }
  // 长后发
  if(c.style==='long'||c.style==='medium'){
    g.fillStyle=c.hair;
    g.beginPath(); g.moveTo(-15,-44); g.quadraticCurveTo(-21,-26,-17,-6); g.lineTo(-11,-6); g.quadraticCurveTo(-14,-28,-9,-44); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(15,-44); g.quadraticCurveTo(21,-26,17,-6); g.lineTo(11,-6); g.quadraticCurveTo(14,-28,9,-44); g.closePath(); g.fill();
  }
  // 身体(裙)
  g.fillStyle=c.outfit;
  g.beginPath(); g.moveTo(-13,0); g.lineTo(-8,-22); g.quadraticCurveTo(0,-25,8,-22); g.lineTo(13,0); g.closePath(); g.fill();
  g.fillStyle=c.outfitDark;
  g.beginPath(); g.moveTo(-13,0); g.lineTo(-8,-22); g.lineTo(-3,-22); g.lineTo(-6,0); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(13,0); g.lineTo(8,-22); g.lineTo(3,-22); g.lineTo(6,0); g.closePath(); g.fill();
  // 蝴蝶结
  if(c.accent){
    g.fillStyle=c.accent;
    g.beginPath(); g.moveTo(0,-25); g.lineTo(-5.5,-28.5); g.lineTo(0,-24.5); g.lineTo(5.5,-28.5); g.closePath(); g.fill();
    g.beginPath(); g.arc(0,-26.5,1.3,0,6.28); g.fill();
  }
  // 头
  g.fillStyle=c.hair; g.beginPath(); g.arc(0,hy,R+3,0,6.28); g.fill();
  g.fillStyle='#f6c9a0'; g.beginPath(); g.arc(0,hy,R,0,6.28); g.fill();
  // 刘海
  g.fillStyle=c.hair;
  g.beginPath(); g.arc(0,hy-9,16.5,Math.PI,2*Math.PI); g.quadraticCurveTo(11,hy-8,0,hy-2); g.quadraticCurveTo(-11,hy-8,-16.5,hy-9); g.closePath(); g.fill();
  // 刘海高光
  g.fillStyle=c.hi;
  g.beginPath(); g.arc(0,hy-10,13.5,Math.PI*1.12,Math.PI*1.88); g.quadraticCurveTo(-2,hy-9,-4,hy-10); g.closePath(); g.fill();
  // 眼睛 / 腮红 / 嘴
  drawEye(g,-7,hy+1,c.eye); drawEye(g,7,hy+1,c.eye);
  g.fillStyle='rgba(255,110,110,.30)';
  g.beginPath(); g.ellipse(-10,hy+5,3.2,1.8,0,0,6.28); g.fill();
  g.beginPath(); g.ellipse(10,hy+5,3.2,1.8,0,0,6.28); g.fill();
  g.strokeStyle='#c07a66'; g.lineWidth=1.1; g.lineCap='round';
  g.beginPath(); g.arc(0,hy+9,2.6,.15*Math.PI,.85*Math.PI); g.stroke();
  // 饰品
  if(c.acc==='halo'){
    g.strokeStyle='#ffd54f'; g.lineWidth=2.5;
    g.beginPath(); g.ellipse(0,hy-24,8.5,2.5,0,0,6.28); g.stroke();
  } else if(c.acc==='horns'){
    g.fillStyle='#c62828';
    g.beginPath(); g.moveTo(-6,hy-13); g.lineTo(-9,hy-23); g.lineTo(-3,hy-15); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(6,hy-13); g.lineTo(9,hy-23); g.lineTo(3,hy-15); g.closePath(); g.fill();
  } else if(c.acc==='triangle'){

function drawEnemy(e){
  const d=e.def, bob=Math.round(Math.sin(state.time*6+e.phase)*1.5);
  const y=e.y+(d.fly?bob*2:0);
  if(d.fly){ ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(e.x,e.y+16,10,3,0,0,6.28); ctx.fill(); }
  else { ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(e.x,e.y+2,13,4,0,0,6.28); ctx.fill(); }
  ctx.save(); ctx.translate(e.x, d.fly? y : y+2); drawEnemyArt(ctx, d.key); ctx.restore();
  // 减速标记
  if(e.slowT>0){ctx.fillStyle='rgba(140,95,192,.55)'; ctx.fillRect(e.x-13,y-36,26,4);}
  // 血条
  const hw=Math.max(14,d.r);
  const hbY=d.fly? y-30 : y-44;
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(e.x-hw-1,hbY,2*hw+2,6);
  const frac=e.hp/e.maxHp; ctx.fillStyle=frac>.5?'#5ad06a':frac>.25?'#ffb300':'#ff5d5d';
  ctx.fillRect(e.x-hw,hbY+1,2*hw*Math.max(0,Math.min(1,frac)),4);
}
function drawProjectile(p){
  const ang=Math.atan2(p.target.y-p.y,p.target.x-p.x);
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(ang);
  ctx.fillStyle=p.color; ctx.fillRect(-8,-2.5,16,5);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6,0,2.5,0,6.28); ctx.fill();
  ctx.restore();
}
function render(){

    const def=OPS[state.placingKey];
    for(const s of ALL_SLOTS){

/* ============================== 输入 ============================== */
function onCardClick(k){
  if(state.over)return;
  if(state.placingKey===k){state.placingKey=null;return;}
  if(deployedKeys.has(k))return;
  if(state.redeploy[k]>0)return;
  state.selected=null; state.placingKey=k; renderSelected();
}
function gridPos(ev){
  const rect=cv.getBoundingClientRect();
  return {x:(ev.clientX-rect.left)/rect.width*W, y:(ev.clientY-rect.top)/rect.height*H};
}
cv.addEventListener('mousemove',ev=>{state.mouse=gridPos(ev);});
cv.addEventListener('mouseleave',()=>{state.mouse={x:-1,y:-1};});
cv.addEventListener('click',ev=>{ audio();
  const p=gridPos(ev);
  if(state.placingKey){
    let placed=false;
    for(const s of ALL_SLOTS){
      if(p.x>=s.x-34&&p.x<=s.x+34&&p.y>=s.y-78&&p.y<=s.y+4){
        if(canPlace(state.placingKey,s)){place(state.placingKey,s);state.placingKey=null;placed=true;break;}
      }
    }
    if(!placed)state.placingKey=null;
    return;
  }
  // 选择已部署干员
  let sel=null;
  for(const op of state.operators){ if(op.alive&&p.x>=op.x-34&&p.x<=op.x+34&&p.y>=op.y-78&&p.y<=op.y+4){sel=op;break;} }
  state.selected=sel; renderSelected();
});
cv.addEventListener('contextmenu',ev=>{ev.preventDefault();state.placingKey=null;state.selected=null;renderSelected();});
window.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){state.placingKey=null;state.selected=null;renderSelected();}
  else if(ev.key==='p'||ev.key==='P')togglePause();
  else if(ev.key>='1'&&ev.key<='6'){const ks=Object.keys(OPS);if(ks[+ev.key-1])onCardClick(ks[+ev.key-1]);}
});
$('speed').onclick=()=>{state.speed=state.speed===1?2:1;};
$('pause').onclick=togglePause;
$('restart').onclick=()=>location.reload();
function togglePause(){ if(state.over)return; state.paused=!state.paused; }

/* ============================== 主循环 ============================== */
let last=performance.now(), lastHud=0;
function frame(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.1);
  if(!state.paused&&state.over===null&&state.started)update(dt*state.speed);
  render();
  updateTopHud();
  if(now-lastHud>130){lastHud=now;updatePanel();}
  requestAnimationFrame(frame);
}

  '快捷键 <span class="kbd">1</span>-<span class="kbd">6</span> 选人 · <span class="kbd">Esc</span> 取消 · <span class="kbd">P</span> 暂停 · 右上 ×2 速度'+
  '</div><button class="big-btn" id="startBtn">开始作战</button>';
  $('overlay').classList.remove('hidden');
  $('startBtn').onclick=()=>{audio();$('overlay').classList.add('hidden');state.started=true;state.intermission=2.5;};
}

/* ============================== 启动 ============================== */
setupCanvas();
buildPanel();
showStart();
requestAnimationFrame(frame);
</script>
</body>
